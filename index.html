<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Depósito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<aside class="side">
  <div class="marca">Depósito</div>
  <nav class="nav" id="nav" aria-label="Vistas"></nav>
  <div id="sesion" class="sesion"></div>
  <div>
    <h4>Herramientas</h4>
    <div class="stack">
      <button class="btn sec sm" data-act="pruebas">Probar reglas</button>
      <button class="btn sec sm" data-act="salir">Salir</button>
    </div>
  </div>
</aside>

<section id="ingreso" class="ingreso" hidden>
  <form id="formIngreso" class="ingreso-caja">
    <h1>Depósito</h1>
    <p class="sub">Ingresá con tu usuario.</p>
    <label class="campo"><span>Email</span><input id="ingEmail" type="email" required autocomplete="username"></label>
    <label class="campo"><span>Contraseña</span><input id="ingClave" type="password" required autocomplete="current-password"></label>
    <p class="msg err" id="ingError" role="alert" hidden></p>
    <button class="btn" type="submit">Ingresar</button>
  </form>
</section>

<main class="main">
  <header class="top">
    <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
    <div id="acciones"></div>
  </header>
  <section class="contenido" id="contenido"></section>
</main>

<dialog id="modal"></dialog>

<script src="js/vendor/qrcode.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
